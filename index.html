<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>


    <!-- DaisyUI & Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
   

  <body>
    <header class="container">
      <section class="mx-auto">
        <div>
          <h1
            class="main-title text-center text-black-80 font-extrabold md:text-2xl text-2xl py-8"
          >
            Job Application Tracker
          </h1>
        </div>
      </section>

      <section class="w-full px-2 mx-auto flex">
        <div class="stats  mx-auto grid grid-cols-3 mx-auto">
          <div class="stat place-items-center bg-blue-300 ">
            <div >Total</div>
            <div id="totalCount" class="stat-value text">8</div>
          </div>

          <div class="stat place-items-center bg-green-200 ">
            <div>Interview</div>
            <div id="interviewCount" class="stat-value">0</div>
          </div>

          <div class="stat place-items-center bg-red-200 ">
            <div >Rejected</div>
            <div id="rejectedCount" class="stat-value">0</div>
          </div>
        </div>
      </section>
    </header>

    <main class="container">
      <div class="mx-auto flex mt-4">
        <div
          class="px-4 py-2  text-center section-header items-center w-[80%] mx-auto flex justify-between"
        >
          <h2 class="text-xl">Available Jobs</h2>
          <p
            id="sectionCount"
            class="rounded-3xl  md:text-xl"
          >
            8 Jobs
          </p>
        </div>
      </div>

      <section class="mx-auto flex justify-center mt-4">
        <div class="flex gap-3">
          <button
            id="tabAll"
            onclick="showTab('all')"
            class="tab-btn px-4 py-2 bg-black-500 text-white"
          >
            All
          </button>

          <button
            id="tabInterview"
            onclick="showTab('interview')"
            class="tab-btn px-4 py-2 "
          >
            Interview
          </button>

          <button
            id="tabRejected"
            onclick="showTab('rejected')"
            class="tab-btn px-4 py-2"
          >
            Rejected
          </button>
        </div>
      </section>
      <!--  -->

      <div id="jobContainer" class="w-[80%] mx-auto job-container mt-6"></div>

      <div
        id="noJobModal"
        class="mx-auto fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50"
      >
        <div
          class="bg-white rounded-lg p-6 w-[80%] max-w-sm text-center relative"
        >
     
          <h2 class="mt-2 text-xl font-bold mb-4">No Jobs Available</h2>
          <p class="mb-4">👴🏻👴🏻👴🏻 Stay Tuned!</p>
          <button
            id="closeModal"
            class="bg-black-500 text-white px-4 py-2"
          >
            Close
          </button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
